<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole</title>
<style>
  :root { --bg:#1d3b2a; --dirt:#6b4a2b; --hole:#2b1d12; --mole:#c98b57; --accent:#ffd166; --text:#f8f4e3; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
         background:
           repeating-linear-gradient(84deg, rgba(170,230,120,.07) 0 2px, transparent 2px 9px),
           repeating-linear-gradient(-78deg, rgba(0,40,0,.12) 0 3px, transparent 3px 12px),
           radial-gradient(circle at top, #2d5a3f, var(--bg)); color:var(--text);
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding:16px; user-select:none; }
  html, body { overscroll-behavior:none; }
  h1 { margin:0 0 6px; font-size:1.6rem; letter-spacing:1px; }
  .hud { display:flex; gap:24px; margin-bottom:14px; font-size:1.1rem; flex-wrap:wrap; justify-content:center; }
  .hud b { color:var(--accent); font-size:1.4rem; }
  .board { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; width:100%; position:relative; z-index:3; touch-action:none; -webkit-tap-highlight-color:transparent; }
  .hole { position:relative; width:100%; aspect-ratio:1; border-radius:50%; background:var(--hole);
          box-shadow: inset 0 10px 18px rgba(0,0,0,.6), 0 4px 0 #3e2a18; overflow:hidden; cursor:pointer; }
  .hole::after { content:""; position:absolute; left:12%; right:12%; bottom:0; height:22%; border-radius:50%;
                 background:var(--dirt); z-index:2; pointer-events:none; }
  .mole { position:absolute; left:15%; right:15%; top:15%; bottom:-10%; border-radius:50%;
          background:
            repeating-radial-gradient(circle at 40% 35%, rgba(70,35,10,.22) 0 1px, transparent 1px 4px),
            radial-gradient(circle at 34% 28%, #f3c896 0%, var(--mole) 45%, #8a5a33 85%);
          box-shadow: inset -10px -12px 18px rgba(60,30,10,.45), inset 8px 10px 14px rgba(255,235,200,.35), 0 8px 10px rgba(0,0,0,.55);
          transform:translateY(120%); transition:transform .12s ease-out; z-index:1; }
  .mole.blue { background:
                 repeating-radial-gradient(circle at 40% 35%, rgba(10,30,70,.25) 0 1px, transparent 1px 4px),
                 radial-gradient(circle at 34% 28%, #cfe9ff 0%, #3a7bd5 45%, #1d4f99 85%);
               box-shadow: inset -10px -12px 18px rgba(5,20,50,.5), inset 8px 10px 14px rgba(200,230,255,.35), 0 8px 10px rgba(0,0,0,.55); }
  .mole.up { transform:translateY(0); }
  .mole.whacked { transform:translateY(120%) scale(.8); }
  .mole::before, .mole::after { content:""; position:absolute; width:12%; height:12%; background:#2b1d12; border-radius:50%; top:38%; }
  .mole::before { left:28%; } .mole::after { right:28%; }
  .mole .nose { position:absolute; left:46%; right:46%; top:50%; height:14%; background:#5a2e1c; border-radius:50%; }
  .mole.blue .nose { background:#16335e; }
  .hit-text { position:absolute; left:50%; top:20%; transform:translate(-50%,0); font-weight:bold; color:var(--accent);
              pointer-events:none; animation:float .6s ease-out forwards; z-index:3; font-size:1.2rem; }
  @keyframes float { to { transform:translate(-50%,-40px); opacity:0; } }
  .hole.miss { animation:shake .2s; }
  @keyframes shake { 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  /* Grass field, grass tufts, and ants */
  .field { position:relative; width:min(92vw, 350px); padding:16px; border-radius:28px;
           background:
             repeating-linear-gradient(80deg, rgba(170,230,120,.12) 0 2px, transparent 2px 7px),
             repeating-linear-gradient(-75deg, rgba(0,40,0,.16) 0 3px, transparent 3px 10px),
             radial-gradient(ellipse at 30% 20%, #5f9e4a, #3c7a36 70%);
           box-shadow: inset 0 0 40px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.35); }
  .layer { position:absolute; inset:0; pointer-events:none; }
  #ants { z-index:1; }
  #tufts { z-index:2; }
  .ant { position:absolute; width:14px; height:10px; }
  .tuft { position:absolute; width:34px; height:26px; }

  /* Earthquake: whole screen shakes, moles freeze with hands raised */
  .mole .hands { display:none; }
  .mole.frozen .hands { display:block; }
  .hands i { position:absolute; top:4%; width:24%; height:22%; background:#f2c79b; border:2px solid #8a5a33;
             border-radius:50%; box-sizing:border-box; }
  .hands i:first-child { left:-10%; }
  .hands i:last-child { right:-10%; }
  .mole.blue .hands i { background:#bfe4ff; border-color:#1d4f99; }
  body.quake { animation: quakeShake .08s linear infinite; }
  @keyframes quakeShake {
    0%   { transform:translate(0,0); }
    25%  { transform:translate(-6px,3px); }
    50%  { transform:translate(5px,-4px); }
    75%  { transform:translate(-3px,-5px); }
    100% { transform:translate(0,0); }
  }

  /* Game Over banner: slams in, then melts downward */
  .banner { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
            pointer-events:none; z-index:10; }
  .banner span { font-size:clamp(2.5rem, 12vw, 5rem); font-weight:900; color:#ff4d4d; letter-spacing:3px;
                 text-shadow:0 5px 0 #7a0000, 0 0 24px rgba(0,0,0,.6); opacity:0; display:inline-block; }
  .banner.show span { animation: slam .4s ease-out forwards, melt 2.6s ease-in 1.2s forwards; }
  @keyframes slam { from { opacity:0; transform:scale(2); } to { opacity:1; transform:scale(1); } }
  @keyframes melt {
    0%   { opacity:1; transform:scaleY(1) translateY(0); filter:blur(0); }
    40%  { transform:scaleY(.95) translateY(8px); }
    100% { opacity:0; transform:scaleY(.1) translateY(160px) skewX(6deg); filter:blur(5px); }
  }

  .lb { margin-top:22px; width:min(90vw, 360px); text-align:center; }
  .lb h2 { margin:0 0 6px; font-size:1.3rem; color:var(--accent); }
  .lb-form { display:none; gap:8px; justify-content:center; margin:6px 0; }
  .lb-form input { padding:8px 14px; border-radius:999px; border:none; font-size:1rem; width:160px; }
  .lb-form button { margin-top:0; padding:8px 18px; font-size:1rem; }
  .lb-status { min-height:1.3em; font-size:.95rem; opacity:.9; }
  .lb ol { list-style:none; padding:0; margin:6px 0 0; text-align:left; }
  .lb li { display:flex; justify-content:space-between; padding:4px 10px; border-bottom:1px solid rgba(248,244,227,.15); }
  .lb li b { color:var(--accent); }
  button { margin-top:18px; padding:12px 28px; font-size:1.1rem; border:none; border-radius:999px; cursor:pointer;
           background:var(--accent); color:#2b1d12; font-weight:700; box-shadow:0 4px 0 #b8923e; }
  button:active { transform:translateY(2px); box-shadow:0 2px 0 #b8923e; }
  .stage { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; }
  .thermo-wrap { display:flex; flex-direction:column; align-items:stretch; gap:6px; width:min(88vw, 320px); }
  .thermo-head { display:flex; justify-content:space-between; align-items:baseline; }
  .acc-label { font-size:1.3rem; font-weight:800; color:var(--accent); }
  .acc-title { font-size:.9rem; opacity:.85; }
  .counts { font-size:.95rem; display:flex; justify-content:space-between; }
  .counts b { color:var(--accent); }
  .thermo { position:relative; width:100%; height:26px; border:3px solid var(--text); border-radius:13px;
            background:#15281d; overflow:hidden; }
  .thermo .fill { height:100%; width:100%; background:#3a7bd5; transition:width .3s ease, background-color .3s; }
  .bonus { height:2.2rem; margin-bottom:6px; font-size:1.6rem; font-weight:900; color:var(--accent);
           text-shadow:0 3px 0 #7a5a00; opacity:0; transform:translateY(8px); transition:opacity .3s, transform .3s; }
  .bonus.show { opacity:1; transform:translateY(0); }
  .msg { margin-top:12px; min-height:1.4em; font-size:1rem; opacity:.9; text-align:center; }
</style>
</head>
<body>
  <h1>🔨 Whack-a-Mole</h1>
  <div class="hud">
    <div>Score <b id="score">0</b></div>
    <div>Time <b id="time">30</b></div>
    <div>Best <b id="best">0</b></div>
  </div>
  <div class="bonus" id="bonus">+5 BONUS! 10 hits in a row</div>
  <div class="stage">
    <div class="field" id="field">
      <div class="layer" id="ants"></div>
      <div class="layer" id="tufts"></div>
      <div class="board" id="board"></div>
    </div>
    <div class="thermo-wrap">
      <div class="thermo-head">
        <span class="acc-title">Accuracy</span>
        <span class="acc-label" id="acc">100%</span>
      </div>
      <div class="thermo"><div class="fill" id="fill"></div></div>
      <div class="counts"><span>Hits <b id="hits-count">0</b></span><span>Misses <b id="misses-count">0</b></span></div>
    </div>
  </div>
  <button id="startBtn">Start Game</button>
  <div class="msg" id="msg">Click the moles before they hide! Misses cost you 1 point. Watch out for blue moles!</div>
  <div class="banner" id="banner"><span>GAME OVER</span></div>

  <section class="lb">
    <h2>Today's Leaderboard</h2>
    <div class="lb-form" id="lb-form">
      <input id="lb-name" maxlength="12" placeholder="Your name">
      <button id="lb-save">Save score</button>
    </div>
    <div class="lb-status" id="lb-status"></div>
    <ol id="lb-list"></ol>
  </section>

<script>
(function () {
  const GAME_TIME = 30;
  const HOLES = 9;
  const BLUE_CHANCE = 0.08;   // chance a pop is a blue mole
  const BLUE_AFTER = 5;       // seconds before blue moles can appear
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const startBtn = document.getElementById('startBtn');
  const msgEl = document.getElementById('msg');
  const bannerEl = document.getElementById('banner');
  const accEl = document.getElementById('acc');
  const fillEl = document.getElementById('fill');
  const hitsEl = document.getElementById('hits-count');
  const missesEl = document.getElementById('misses-count');
  const ACCURACY_GAME_OVER = 50;   // game ends at or below this percentage
  const ACCURACY_FULL = 99;        // blue at or above this; blends to red down to 50
  let hits = 0, misses = 0;

  let score = 0, timeLeft = GAME_TIME, running = false;
  let spawnTimer = null, tickTimer = null;
  let best = 0;
  let audioCtx = null;
  let quakeActive = false, quakeTimer = null;
  const QUAKE_LENGTH = 3000;   // ms
  const QUAKE_AFTER = 8;       // seconds before earthquakes can happen
  const QUAKE_CHANCE = 0.04;   // chance per spawn tick
  let streak = 0;            // consecutive normal-mole hits
  let bonusTimer = null;
  const STREAK_BONUS_AT = 10;
  const STREAK_BONUS_POINTS = 5;
  const bonusEl = document.getElementById('bonus');
  try { best = parseInt(localStorage.getItem('whackBest'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // Build holes
  const holes = [];
  for (let i = 0; i < HOLES; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    const mole = document.createElement('div');
    mole.className = 'mole';
    const nose = document.createElement('div');
    nose.className = 'nose';
    mole.appendChild(nose);
    const hands = document.createElement('div');
    hands.className = 'hands';
    hands.innerHTML = '<i></i><i></i>';
    mole.appendChild(hands);
    hole.appendChild(mole);
    hole.addEventListener('pointerdown', () => onWhack(i));
    boardEl.appendChild(hole);
    holes.push({ hole, mole, hideTimer: null, isBlue: false });
  }

  // ---- Decoration: grass tufts and wandering ants ----
  const antsLayer = document.getElementById('ants');
  const tuftsLayer = document.getElementById('tufts');
  const GREENS = ['#2e6b2a', '#4f9a3c', '#7cc15a', '#3f8a33'];
  const rand = (a, b) => a + Math.random() * (b - a);

  const TUFT_SVG = c => `<svg viewBox="0 0 40 30" width="100%" height="100%"><g fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M20 30 Q14 12 6 6"/><path d="M20 30 Q18 10 20 2"/><path d="M20 30 Q22 12 33 8"/><path d="M20 30 Q12 18 2 16"/><path d="M20 30 Q27 18 37 20"/></g></svg>`;
  const ANT_SVG = `<svg viewBox="0 0 20 14" width="100%" height="100%"><g fill="#2a1a0e"><circle cx="16" cy="7" r="2.2"/><ellipse cx="10" cy="7" rx="2.6" ry="1.8"/><ellipse cx="4" cy="7" rx="3.4" ry="2.6"/></g><g stroke="#2a1a0e" stroke-width=".7"><path d="M9 7 L5 1 M9 7 L5 13 M10 7 L8 0 M10 7 L8 14 M11 7 L14 1 M11 7 L14 13"/></g></svg>`;

  // Grass tufts scattered over the field (sit above the ants, below the holes)
  for (let i = 0; i < 22; i++) {
    const t = document.createElement('div');
    t.className = 'tuft';
    t.innerHTML = TUFT_SVG(GREENS[Math.floor(Math.random() * GREENS.length)]);
    t.style.left = rand(2, 98) + '%';
    t.style.top = rand(2, 98) + '%';
    t.style.transform = `translate(-50%,-100%) rotate(${rand(-25, 25)}deg) scale(${rand(0.6, 1.2)})`;
    tuftsLayer.appendChild(t);
  }

  // 25 ants wandering behind the grass and under the holes
  const ants = [];
  for (let i = 0; i < 25; i++) {
    const el = document.createElement('div');
    el.className = 'ant';
    el.innerHTML = ANT_SVG;
    antsLayer.appendChild(el);
    ants.push({ el, x: rand(3, 97), y: rand(3, 97), tx: rand(3, 97), ty: rand(3, 97), speed: rand(5, 11), angle: 0 });
  }

  let lastTs = performance.now();
  function antLoop(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    ants.forEach(a => {
      const dx = a.tx - a.x, dy = a.ty - a.y, dist = Math.hypot(dx, dy);
      if (dist < 2) {
        a.tx = rand(3, 97); a.ty = rand(3, 97);
      } else {
        const step = Math.min(dist, a.speed * dt);
        a.x += dx / dist * step;
        a.y += dy / dist * step;
        a.angle = Math.atan2(dy, dx) * 180 / Math.PI;
      }
      a.el.style.left = a.x + '%';
      a.el.style.top = a.y + '%';
      a.el.style.transform = `translate(-50%,-50%) rotate(${a.angle}deg)`;
    });
    requestAnimationFrame(antLoop);
  }
  requestAnimationFrame(antLoop);

  function setScore(n) { score = n; scoreEl.textContent = score; }

  // Difficulty: moles stay up and spawn faster as time passes
  function currentDifficulty() {
    const elapsed = GAME_TIME - timeLeft;
    return {
      upTime: Math.max(550, 1400 - elapsed * 30),
      spawnDelay: Math.max(280, 1000 - elapsed * 25),
      extra: elapsed > 15 ? 1 : 0   // occasionally pop two at once late in the game
    };
  }

  function popMole() {
    if (!running || quakeActive) return;
    const { upTime, extra } = currentDifficulty();
    const elapsed = GAME_TIME - timeLeft;
    const count = 1 + (extra && Math.random() < 0.3 ? 1 : 0);
    for (let c = 0; c < count; c++) {
      const idle = holes.map((h, i) => i).filter(i => !holes[i].mole.classList.contains('up'));
      if (!idle.length) break;
      const i = idle[Math.floor(Math.random() * idle.length)];
      const h = holes[i];
      const isBlue = elapsed >= BLUE_AFTER && Math.random() < BLUE_CHANCE;
      h.isBlue = isBlue;
      h.mole.classList.toggle('blue', isBlue);
      h.mole.classList.remove('whacked');
      h.mole.classList.add('up');
      h.hideTimer = setTimeout(() => hide(i), upTime);
    }
  }

  function hide(i) {
    const h = holes[i];
    clearTimeout(h.hideTimer);
    h.mole.classList.remove('up');
  }

  function onWhack(i) {
    if (!running) return;
    const h = holes[i];
    const isUp = h.mole.classList.contains('up');
    if (isUp && !h.mole.classList.contains('whacked') && h.isBlue) {
      // Hit a blue mole: game over
      h.mole.classList.add('whacked');
      endGame('blue');
      return;
    }
    if (isUp && !h.mole.classList.contains('whacked')) {
      h.mole.classList.add('whacked');
      setScore(score + 1);
      floatText(h.hole, '+1');
      playHitSound();
      hits++;
      updateAccuracy();
      streak++;
      if (streak >= STREAK_BONUS_AT) {
        setScore(score + STREAK_BONUS_POINTS);
        showBonus();
        streak = 0;
      }
      clearTimeout(h.hideTimer);
      setTimeout(() => hide(i), 120);
    } else {
      setScore(score - 1);
      streak = 0;
      playMissSound();
      misses++;
      if (updateAccuracy() <= ACCURACY_GAME_OVER) endGame('accuracy');
      h.hole.classList.remove('miss');
      void h.hole.offsetWidth;
      h.hole.classList.add('miss');
      floatText(h.hole, '-1', '#ff6b6b');
    }
  }

  // Low rumble for the earthquake: filtered noise plus a deep wobbling tone
  let quakeNodes = [];
  function playQuakeSound() {
    const ctx = getAudio();
    if (!ctx) return;
    const dur = QUAKE_LENGTH / 1000;
    const t0 = ctx.currentTime;

    const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const lowpass = ctx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.value = 140;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.9, t0 + 0.2);
    noiseGain.gain.setValueAtTime(0.9, t0 + dur - 0.6);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    noise.connect(lowpass).connect(noiseGain).connect(ctx.destination);

    const rumble = ctx.createOscillator();
    const rumbleGain = ctx.createGain();
    rumble.type = 'sawtooth';
    rumble.frequency.setValueAtTime(48, t0);
    rumble.frequency.linearRampToValueAtTime(34, t0 + dur);
    rumbleGain.gain.setValueAtTime(0.0001, t0);
    rumbleGain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.2);
    rumbleGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    rumble.connect(rumbleGain).connect(ctx.destination);

    noise.start(t0);
    noise.stop(t0 + dur);
    rumble.start(t0);
    rumble.stop(t0 + dur);
    quakeNodes = [noise, rumble];
  }

  // Earthquakes: random chance after a while, lasting 3 seconds
  function maybeQuake() {
    const elapsed = GAME_TIME - timeLeft;
    if (!quakeActive && elapsed >= QUAKE_AFTER && Math.random() < QUAKE_CHANCE) startQuake();
  }

  function startQuake() {
    quakeActive = true;
    document.body.classList.add('quake');
    holes.forEach(h => {
      if (h.mole.classList.contains('up')) {
        clearTimeout(h.hideTimer);          // freeze moles that are up
        h.mole.classList.add('frozen');     // hands over heads
      }
    });
    msgEl.textContent = 'EARTHQUAKE! Hold on!';
    playQuakeSound();
    clearTimeout(quakeTimer);
    quakeTimer = setTimeout(endQuake, QUAKE_LENGTH);
  }

  function endQuake() {
    quakeActive = false;
    document.body.classList.remove('quake');
    holes.forEach((h, i) => {
      h.mole.classList.remove('frozen');
      if (h.mole.classList.contains('up')) {
        clearTimeout(h.hideTimer);
        h.hideTimer = setTimeout(() => hide(i), 700);   // let them hide soon after
      }
    });
    if (running) msgEl.textContent = 'Phew! Back to whacking.';
  }

  function stopQuake() {
    clearTimeout(quakeTimer);
    quakeNodes.forEach(n => { try { n.stop(); } catch (e) {} });
    quakeNodes = [];
    quakeActive = false;
    document.body.classList.remove('quake');
    holes.forEach(h => h.mole.classList.remove('frozen'));
  }

  // Thermometer colour: blue at 80%+, smoothly blending to red by 50%
  function thermoColor(pct) {
    const blue = [58, 123, 213], red = [229, 57, 53];
    let t = (ACCURACY_FULL - pct) / (ACCURACY_FULL - ACCURACY_GAME_OVER);
    t = Math.max(0, Math.min(1, t));
    const c = blue.map((b, i) => Math.round(b + (red[i] - b) * t));
    return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
  }

  function updateAccuracy() {
    const total = hits + misses;
    const pct = total ? Math.round(hits / total * 100) : 100;
    const color = thermoColor(pct);
    accEl.textContent = pct + '%';
    accEl.style.color = color;
    fillEl.style.width = Math.max(0, Math.min(100, pct)) + '%';
    fillEl.style.background = color;
    hitsEl.textContent = hits;
    missesEl.textContent = misses;
    return pct;
  }

  // Shows the streak bonus above the board for 3 seconds
  function showBonus() {
    bonusEl.classList.add('show');
    clearTimeout(bonusTimer);
    bonusTimer = setTimeout(() => bonusEl.classList.remove('show'), 3000);
  }

  function floatText(parent, text, color) {
    const span = document.createElement('div');
    span.className = 'hit-text';
    span.textContent = text;
    if (color) span.style.color = color;
    parent.appendChild(span);
    setTimeout(() => span.remove(), 650);
  }

  function scheduleSpawn() {
    if (!running) return;
    const { spawnDelay } = currentDifficulty();
    spawnTimer = setTimeout(() => {
      popMole();
      maybeQuake();
      scheduleSpawn();
    }, spawnDelay * (0.7 + Math.random() * 0.6));
  }

  // Sad "wah-wah-wahhh" descending trombone, made with Web Audio (no files needed)
  function playSadSound() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioCtx = audioCtx || new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t0 = audioCtx.currentTime + 0.05;
      const notes = [
        [392, 0.00, 0.45],
        [370, 0.45, 0.45],
        [349, 0.90, 0.45],
        [330, 1.35, 1.30]
      ];
      notes.forEach(([freq, start, dur]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t0 + start);
        osc.frequency.linearRampToValueAtTime(freq * 0.9, t0 + start + dur);
        gain.gain.setValueAtTime(0.0001, t0 + start);
        gain.gain.exponentialRampToValueAtTime(0.25, t0 + start + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0 + start);
        osc.stop(t0 + start + dur + 0.05);
      });
    } catch (e) { /* audio unavailable; the game still works */ }
  }

  // Shared audio helper: returns a ready AudioContext, or null if unavailable
  function getAudio() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = audioCtx || new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }

  // Bright two-note "ding" on a successful whack
  function playHitSound() {
    const ctx = getAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime;
    [[880, 0.00], [1320, 0.07]].forEach(([freq, start]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t0 + start);
      gain.gain.setValueAtTime(0.0001, t0 + start);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + start + 0.15);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0 + start);
      osc.stop(t0 + start + 0.16);
    });
  }

  // Short low, buzzy "bonk" on a miss
  function playMissSound() {
    const ctx = getAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(180, t0);
    osc.frequency.exponentialRampToValueAtTime(70, t0 + 0.22);
    gain.gain.setValueAtTime(0.18, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.26);
  }

  function showBanner() {
    bannerEl.classList.remove('show');
    void bannerEl.offsetWidth;   // restart the animation
    bannerEl.classList.add('show');
  }

  function startGame() {
    if (running) return;
    running = true;
    setScore(0);
    streak = 0;
    hits = 0;
    misses = 0;
    updateAccuracy();
    clearTimeout(bonusTimer);
    bonusEl.classList.remove('show');
    stopQuake();
    timeLeft = GAME_TIME;
    timeEl.textContent = timeLeft;
    msgEl.textContent = 'Go! Watch for blue moles!';
    bannerEl.classList.remove('show');
    startBtn.style.display = 'none';
    tickTimer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame(null);
    }, 1000);
    popMole();
    scheduleSpawn();
  }

  // overBy: null (time ran out), 'blue' (hit a blue mole), or 'accuracy' (fell to 50%)
  function endGame(overBy) {
    running = false;
    clearInterval(tickTimer);
    clearTimeout(spawnTimer);
    stopQuake();
    holes.forEach((h, i) => hide(i));
    const newBest = score > best;
    if (newBest) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('whackBest', String(best)); } catch (e) {}
    }
    if (overBy) {
      timeEl.textContent = timeLeft;
      showBanner();
      playSadSound();
      const reason = overBy === 'blue'
        ? 'You whacked a blue mole!'
        : `Accuracy dropped to ${ACCURACY_GAME_OVER}%!`;
      msgEl.textContent = `${reason} Final score: ${score}` + (newBest ? ' (New best!)' : '');
    } else {
      timeEl.textContent = 0;
      msgEl.textContent = newBest
        ? `New best! Final score: ${score}`
        : `Time's up! Final score: ${score}`;
    }
    startBtn.textContent = 'Play Again';
    startBtn.style.display = 'inline-block';
    // Lets the leaderboard script offer to save this score
    window.dispatchEvent(new CustomEvent('whack-gameover', { detail: { score } }));
  }

  startBtn.addEventListener('click', startGame);
})();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, doc, getDoc, setDoc, query, where, limit, getDocs, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Paste your Firebase web app config here (Project settings > Your apps).
  // These values identify the project; they are not secret. Access is controlled by firestore.rules.
  const firebaseConfig = {
    apiKey: "AIzaSyCtudIW6g80kBRFUQAxa3KgUD7QIBVTrJc",
    authDomain: "whacky-310b5.firebaseapp.com",
    projectId: "whacky-310b5",
    appId: "1:240628370820:web:3ef1a64ba2ab551a3e61d1"
  };

  const formEl = document.getElementById('lb-form');
  const nameEl = document.getElementById('lb-name');
  const saveBtn = document.getElementById('lb-save');
  const listEl = document.getElementById('lb-list');
  const statusEl = document.getElementById('lb-status');
  let pendingScore = null;

  const configured = !firebaseConfig.projectId.startsWith('REPLACE');
  let db = null;
  if (configured) {
    try { db = getFirestore(initializeApp(firebaseConfig)); } catch (e) { db = null; }
  }
  if (!db) statusEl.textContent = 'Leaderboard is not set up yet.';

  // Scores are grouped by day in Toronto time (Eastern), so the board resets at midnight
  function todayKey() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    const get = t => parts.find(p => p.type === t).value;
    return `${get('year')}-${get('month')}-${get('day')}`;
  }

  async function loadBoard() {
    if (!db) return;
    try {
      const day = todayKey();
      // Single-field filter only, so no composite index is needed; sorting happens here
      const snap = await getDocs(query(collection(db, 'scores'), where('day', '==', day), limit(200)));
      const rows = snap.docs.map(d => d.data()).sort((a, b) => b.score - a.score).slice(0, 10);
      listEl.innerHTML = '';
      rows.forEach(v => {
        const li = document.createElement('li');
        const name = document.createElement('span');
        name.textContent = v.name;               // textContent avoids injecting HTML
        const pts = document.createElement('b');
        pts.textContent = v.score;
        li.append(name, pts);
        listEl.appendChild(li);
      });
      if (!rows.length) statusEl.textContent = 'No scores yet today. Be the first!';
    } catch (e) {
      statusEl.textContent = 'Could not load the leaderboard.';
    }
  }

  window.addEventListener('whack-gameover', e => {
    const score = e.detail.score;
    if (!db) return;
    if (score <= 0) { statusEl.textContent = 'Scores of 0 are not saved.'; return; }
    pendingScore = score;
    formEl.style.display = 'flex';
    nameEl.value = '';
    nameEl.focus();
    statusEl.textContent = `Enter your name to save ${score} points:`;
  });

  saveBtn.addEventListener('click', async () => {
    const name = nameEl.value.trim();
    if (!name) { statusEl.textContent = 'Please enter a name.'; return; }
    if (!/^[A-Za-z0-9 _-]{1,12}$/.test(name)) {
      statusEl.textContent = 'Use 1-12 letters, numbers, spaces, _ or -.';
      return;
    }
    // One entry per name per day: the document ID is the day plus the lowercase name
    const day = todayKey();
    const ref = doc(db, 'scores', `${day}__${name.toLowerCase()}`);
    saveBtn.disabled = true;
    try {
      const existing = await getDoc(ref);
      if (existing.exists()) {
        statusEl.textContent = `"${name}" is already taken today. Try another name.`;
        return;
      }
      await setDoc(ref, { name, score: pendingScore, day, createdAt: serverTimestamp() });
      formEl.style.display = 'none';
      statusEl.textContent = 'Saved!';
      pendingScore = null;
      await loadBoard();
    } catch (err) {
      statusEl.textContent = 'Could not save your score. Try again later.';
    } finally {
      saveBtn.disabled = false;
    }
  });

  loadBoard();
</script>
</body>
