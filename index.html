<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole</title>
  <!-- Home screen icon and name for "Add to Home Screen" on iPhone and iPad -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Whack-a-Mole">
  <meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --bg:#1d3b2a; --dirt:#6b4a2b; --hole:#2b1d12; --mole:#c98b57; --accent:#ffd166; --text:#f8f4e3; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
         background:
           repeating-linear-gradient(84deg, rgba(170,230,120,.07) 0 2px, transparent 2px 9px),
           repeating-linear-gradient(-78deg, rgba(0,40,0,.12) 0 3px, transparent 3px 12px),
           radial-gradient(circle at top, #2d5a3f, var(--bg)); color:var(--text);
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding:16px; user-select:none; }
  html, body { overscroll-behavior:none; touch-action:manipulation; }
  h1 { margin:0 0 6px; font-size:1.6rem; letter-spacing:1px; }
  .hud { display:flex; gap:24px; margin-bottom:14px; font-size:1.1rem; flex-wrap:wrap; justify-content:center; }
  .hud b { color:var(--accent); font-size:1.4rem; }
  .board { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; width:100%; position:relative; z-index:3; touch-action:none; -webkit-tap-highlight-color:transparent; }
  .hole { position:relative; width:100%; aspect-ratio:1; border-radius:50%; background:var(--hole);
          box-shadow: inset 0 10px 18px rgba(0,0,0,.6), 0 4px 0 #3e2a18; overflow:hidden; cursor:pointer; }
  .hole::after { content:""; position:absolute; left:12%; right:12%; bottom:0; height:22%; border-radius:50%;
                 background:var(--dirt); z-index:2; pointer-events:none; }
  .mole { position:absolute; left:15%; right:15%; top:15%; bottom:-10%; border-radius:50%;
          background:
            repeating-radial-gradient(circle at 40% 35%, rgba(70,35,10,.22) 0 1px, transparent 1px 4px),
            radial-gradient(circle at 34% 28%, #f3c896 0%, var(--mole) 45%, #8a5a33 85%);
          box-shadow: inset -10px -12px 18px rgba(60,30,10,.45), inset 8px 10px 14px rgba(255,235,200,.35), 0 8px 10px rgba(0,0,0,.55);
          transform:translateY(120%); transition:transform .12s ease-out; z-index:1; }
  .mole::before, .mole::after { content:""; position:absolute; width:12%; height:12%; background:#2b1d12; border-radius:50%; top:38%; }
  .mole::before { left:28%; } .mole::after { right:28%; }
  .mole .nose { position:absolute; left:46%; right:46%; top:50%; height:14%; background:#5a2e1c; border-radius:50%; }
  .mole.blue { background:
                 repeating-radial-gradient(circle at 40% 35%, rgba(10,30,70,.25) 0 1px, transparent 1px 4px),
                 radial-gradient(circle at 34% 28%, #cfe9ff 0%, #3a7bd5 45%, #1d4f99 85%);
               box-shadow: inset -10px -12px 18px rgba(5,20,50,.5), inset 8px 10px 14px rgba(200,230,255,.35), 0 8px 10px rgba(0,0,0,.55); }
  .mole.blue .nose { background:#16335e; }
  .mole.up { transform:translateY(0); }
  .mole.whacked { transform:translateY(120%) scale(.8); }
  .hit-text { position:absolute; left:50%; top:20%; transform:translate(-50%,0); font-weight:bold; color:var(--accent);
              pointer-events:none; animation:float .6s ease-out forwards; z-index:3; font-size:1.2rem; }
  @keyframes float { to { transform:translate(-50%,-40px); opacity:0; } }
  .hole.miss { animation:shake .2s; }
  @keyframes shake { 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  /* Grass field, grass tufts, and ants */
  .field { position:relative; width:min(92vw, 350px); padding:16px; }
  .layer { position:absolute; inset:0; pointer-events:none; }
  /* Ants cover the whole screen, above the background and below grass tufts and holes */
  #ants { position:fixed; inset:0; z-index:1; overflow:hidden; pointer-events:none; }
  /* Grass tufts cover the whole screen: above the ants, below the holes and text */
  #tufts { position:absolute; top:0; left:0; width:100%; z-index:2; overflow:hidden; pointer-events:none; }
  /* Ladybugs sit above the grass and below the holes and text */
  #bugs { position:fixed; inset:0; z-index:2; overflow:hidden; pointer-events:none; }
  .bug { position:absolute; width:26px; height:26px; }
  .bug svg { display:block; width:100%; height:100%; overflow:visible; }
  /* Wings pivot at the body; when flying they open wide and beat up and down */
  .bug .wing { display:none; transform-box:view-box; transform-origin:23px 20px; }
  .bug.flying .wing, .bug.flutter .wing { display:inline; animation: flapWide .1s ease-in-out infinite alternate; }
  @keyframes flapWide { from { transform:scaleY(1.1); } to { transform:scaleY(1.9); } }
  .bug.flying svg { filter: drop-shadow(6px 9px 3px rgba(0,0,0,.35)); }
  .bug.walking svg { animation: waddle .35s ease-in-out infinite alternate; }
  @keyframes waddle { from { transform:translateY(-1px); } to { transform:translateY(1px); } }
  .ant { position:absolute; width:14px; height:10px; }
  .tuft { position:absolute; width:34px; height:26px; }

  /* Earthquake: whole screen shakes, moles freeze with hands raised */
  .mole .hands { display:none; }
  .mole.frozen .hands { display:block; }
  .hands i { position:absolute; top:4%; width:24%; height:22%; background:#f2c79b; border:2px solid #8a5a33;
             border-radius:50%; box-sizing:border-box; }
  .hands i:first-child { left:-10%; }
  .hands i:last-child { right:-10%; }
  .mole.blue .hands i { background:#bfe4ff; border-color:#1d4f99; }
  body.quake { animation: quakeShake .08s linear infinite; }
  @keyframes quakeShake {
    0%   { transform:translate(0,0); }
    25%  { transform:translate(-6px,3px); }
    50%  { transform:translate(5px,-4px); }
    75%  { transform:translate(-3px,-5px); }
    100% { transform:translate(0,0); }
  }

  /* Worm: sits on the ants layer, so the grass tufts cover it */
  .worm { position:absolute; width:70px; height:14px; transition: opacity .4s ease; }
  .worm svg { display:block; width:100%; height:100%; overflow:visible; transform-origin:100% 50%; }
  .worm ellipse { animation: wiggle 1s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform:translateY(-1.5px); } to { transform:translateY(1.5px); } }
  /* Dirt hole left where a worm burrows in or comes up */
  .worm-hole { position:absolute; width:14px; height:9px; border-radius:50%; pointer-events:none;
               background: radial-gradient(ellipse at center, #1a0f07 45%, #4a2e14 75%, transparent 100%);
               transition: opacity 2s ease; }
  /* The little boy: about twice a grass tuft tall. Runs from ladybugs, then crouches in the grass to hide */
  .boy { position:absolute; width:26px; height:52px; pointer-events:none; }
  .boy svg { width:100%; height:100%; overflow:visible; display:block; }
  .boy .leg-l, .boy .leg-r, .boy .arm-l, .boy .arm-r, .boy .hair { transform-box:view-box; }
  .boy .leg-l { transform-origin:16px 50px; }
  .boy .leg-r { transform-origin:24px 50px; }
  .boy .arm-l { transform-origin:9px 29px; }
  .boy .arm-r { transform-origin:31px 29px; }
  .boy .hair { transform-origin:20px 14px; animation: hairSway 1.8s ease-in-out infinite alternate; }
  .boy.running .leg-l, .boy.running .arm-r { animation: limbA .22s ease-in-out infinite alternate; }
  .boy.running .leg-r, .boy.running .arm-l { animation: limbB .22s ease-in-out infinite alternate; }
  .boy.running .hair { animation-duration: .35s; }
  .boy.crouch svg { transform: scaleY(.55); transform-origin:50% 100%; }
  @keyframes limbA { from { transform:rotate(-28deg); } to { transform:rotate(28deg); } }
  @keyframes limbB { from { transform:rotate(28deg); } to { transform:rotate(-28deg); } }
  @keyframes hairSway { from { transform:skewX(-5deg); } to { transform:skewX(5deg); } }
  /* Small version tag in the bottom-left corner: bump it with every update */
  .ver-tag { position:fixed; left:6px; bottom:4px; z-index:11; font-size:11px; color:rgba(255,255,255,.55);
             pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  /* 3-2-1 countdown: big numbers with wings that flap as they fly away */
  .countdown { position:fixed; inset:0; pointer-events:none; z-index:9; }
  .count-num { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:1.35in; font-weight:900;
               line-height:1; color:var(--accent); text-shadow:0 6px 0 #7a5a00, 0 0 30px rgba(0,0,0,.5); white-space:nowrap; }
  .count-wing { position:absolute; top:50%; width:.85in; height:.6in; margin-top:-.3in; }
  .count-wing svg { width:100%; height:100%; display:block; }
  .count-wing.l { right:100%; margin-right:-.15in; }
  .count-wing.r { left:100%; margin-left:-.15in; }
  .count-wing.l svg { transform-origin:100% 50%; animation: flapL .11s ease-in-out infinite alternate; }
  .count-wing.r svg { transform-origin:0% 50%; animation: flapR .11s ease-in-out infinite alternate; }
  @keyframes flapL { from { transform:rotate(-30deg); } to { transform:rotate(12deg); } }
  @keyframes flapR { from { transform:rotate(30deg); } to { transform:rotate(-12deg); } }

  /* Game Over banner: slams in, then melts downward */
  .banner { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
            pointer-events:none; z-index:10; }
  .banner span { font-size:clamp(2.5rem, 12vw, 5rem); font-weight:900; color:#ff4d4d; letter-spacing:3px;
                 text-shadow:0 5px 0 #7a0000, 0 0 24px rgba(0,0,0,.6); opacity:0; display:inline-block; }
  .banner.show span { animation: slam .4s ease-out forwards, melt 2.6s ease-in 1.2s forwards; }
  @keyframes slam { from { opacity:0; transform:scale(2); } to { opacity:1; transform:scale(1); } }
  @keyframes melt {
    0%   { opacity:1; transform:scaleY(1) translateY(0); filter:blur(0); }
    40%  { transform:scaleY(.95) translateY(8px); }
    100% { opacity:0; transform:scaleY(.1) translateY(160px) skewX(6deg); filter:blur(5px); }
  }

  .lb { margin-top:22px; width:min(90vw, 360px); text-align:center; }
  .lb h2 { margin:0 0 6px; font-size:1.3rem; color:var(--accent); }
  .lb-form { display:none; gap:8px; justify-content:center; margin:6px 0; }
  .lb-form input { padding:8px 14px; border-radius:999px; border:none; font-size:1rem; width:160px; }
  .lb-form button { margin-top:0; padding:8px 18px; font-size:1rem; }
  .lb-status { min-height:1.3em; font-size:.95rem; opacity:.9; }
  .lb ol { list-style:none; padding:0; margin:6px 0 0; text-align:left; }
  .lb li { display:flex; justify-content:space-between; padding:4px 10px; border-bottom:1px solid rgba(248,244,227,.15); }
  .lb li b { color:var(--accent); }
  button { margin-top:18px; padding:12px 28px; font-size:1.1rem; border:none; border-radius:999px; cursor:pointer;
           background:var(--accent); color:#2b1d12; font-weight:700; box-shadow:0 4px 0 #b8923e; }
  button:active { transform:translateY(2px); box-shadow:0 2px 0 #b8923e; }
  /* Keep text and controls above the grass */
  h1, .hud, .bonus, .thermo-wrap, button, .msg, .lb { position:relative; z-index:3; }
  .stage { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; touch-action:none; }
  .hole { touch-action:none; }
  .thermo-wrap { display:flex; flex-direction:column; align-items:stretch; gap:6px; width:min(88vw, 320px); }
  .thermo-head { display:flex; justify-content:space-between; align-items:baseline; }
  .acc-label { font-size:1.3rem; font-weight:800; color:var(--accent); }
  .acc-title { font-size:.9rem; opacity:.85; }
  .counts { font-size:.95rem; display:flex; justify-content:space-between; }
  .counts b { color:var(--accent); }
  .thermo { position:relative; width:100%; height:26px; border:3px solid var(--text); border-radius:13px;
            background:#15281d; overflow:hidden; }
  .thermo .fill { height:100%; width:100%; background:#3a7bd5; transition:width .3s ease, background-color .3s; }
  .bonus { height:2.2rem; margin-bottom:6px; font-size:1.6rem; font-weight:900; color:var(--accent);
           text-shadow:0 3px 0 #7a5a00; opacity:0; transform:translateY(8px); transition:opacity .3s, transform .3s; }
  .bonus.show { opacity:1; transform:translateY(0); }
  .msg { margin-top:12px; min-height:1.4em; font-size:1rem; opacity:.9; text-align:center; }
</style>
</head>
<body>
  <!-- Shared SVG definitions for the moles and grass -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="furDark" cx="40%" cy="30%" r="75%">
        <stop offset="0" stop-color="#7a6356"/><stop offset=".55" stop-color="#4a3a31"/><stop offset="1" stop-color="#22180f"/>
      </radialGradient>
      <radialGradient id="furBlue" cx="40%" cy="30%" r="75%">
        <stop offset="0" stop-color="#a9d4ff"/><stop offset=".55" stop-color="#3a7bd5"/><stop offset="1" stop-color="#14305e"/>
      </radialGradient>
      <radialGradient id="snoutGrad" cx="40%" cy="35%" r="70%">
        <stop offset="0" stop-color="#ffd3cf"/><stop offset=".6" stop-color="#e59b98"/><stop offset="1" stop-color="#a85f63"/>
      </radialGradient>
      <radialGradient id="pawGrad" cx="40%" cy="35%" r="70%">
        <stop offset="0" stop-color="#fbe3d6"/><stop offset="1" stop-color="#d9a08f"/>
      </radialGradient>
      <symbol id="tuftSym" viewBox="0 0 40 30">
        <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <path d="M20 30 Q14 12 6 6"/><path d="M20 30 Q18 10 20 2"/><path d="M20 30 Q22 12 33 8"/><path d="M20 30 Q12 18 2 16"/><path d="M20 30 Q27 18 37 20"/>
        </g>
      </symbol>
      <filter id="furTex" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
        <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
        <feComponentTransfer in="gray" result="shade">
          <feFuncR type="linear" slope=".5" intercept=".6"/>
          <feFuncG type="linear" slope=".5" intercept=".6"/>
          <feFuncB type="linear" slope=".5" intercept=".6"/>
          <feFuncA type="linear" slope="0" intercept="1"/>
        </feComponentTransfer>
        <feBlend in="SourceGraphic" in2="shade" mode="multiply" result="textured"/>
        <feComposite in="textured" in2="SourceGraphic" operator="in"/>
      </filter>
    </defs>
  </svg>
  <div class="ver-tag">v1.15</div>
  <div class="screen-ants" id="ants"></div>
  <div class="screen-tufts" id="tufts"></div>
  <div class="screen-bugs" id="bugs"></div>
  <h1>🔨 Whack-a-Mole</h1>
  <div class="msg" id="msg">Click the moles before they hide! Misses cost you 1 point. Watch out for blue moles!</div>
  <div class="bonus" id="bonus">+5 BONUS! 10 hits in a row</div>
  <div class="stage">
    <div class="field" id="field">
      <div class="board" id="board"></div>
    </div>
    <div class="thermo-wrap">
      <div class="thermo-head">
        <span class="acc-title">Accuracy</span>
        <span class="acc-label" id="acc">100%</span>
      </div>
      <div class="thermo"><div class="fill" id="fill"></div></div>
      <div class="counts"><span>Hits <b id="hits-count">0</b></span><span>Misses <b id="misses-count">0</b></span></div>
    </div>
  </div>
  <button id="startBtn">Start Game</button>
  <div class="hud">
    <div>Score <b id="score">0</b></div>
    <div>Time <b id="time">60</b></div>
    <div>Best <b id="best">0</b></div>
  </div>
  <div class="countdown" id="countdown"></div>
  <div class="banner" id="banner"><span>GAME OVER</span></div>

  <section class="lb">
    <h2>Today's Leaderboard</h2>
    <div class="lb-form" id="lb-form">
      <input id="lb-name" maxlength="12" placeholder="Your name">
      <button id="lb-save">Save score</button>
    </div>
    <div class="lb-status" id="lb-status"></div>
    <ol id="lb-list"></ol>
  </section>

<script>
(function () {
  const GAME_TIME = 60;
  const HOLES = 9;
  const BLUE_CHANCE = 0.08;   // chance a pop is a blue mole
  const BLUE_AFTER = 5;       // seconds before blue moles can appear
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const startBtn = document.getElementById('startBtn');
  const msgEl = document.getElementById('msg');
  const bannerEl = document.getElementById('banner');
  const accEl = document.getElementById('acc');
  const fillEl = document.getElementById('fill');
  const hitsEl = document.getElementById('hits-count');
  const missesEl = document.getElementById('misses-count');
  const ACCURACY_GAME_OVER = 50;   // game ends at or below this percentage
  const ACCURACY_FULL = 99;        // blue at or above this; blends to red down to 50
  let hits = 0, misses = 0;

  let score = 0, timeLeft = GAME_TIME, running = false;
  let spawnTimer = null, tickTimer = null;
  let best = 0;
  let audioCtx = null;
  let countingDown = false;
  let quakeActive = false, quakeTimer = null;
  const QUAKE_LENGTH = 3000;   // ms
  const QUAKE_AFTER = 8;       // seconds before earthquakes can happen
  const QUAKE_CHANCE = 0.012;  // chance per spawn tick
  let streak = 0;            // consecutive normal-mole hits
  let bonusTimer = null;
  const STREAK_BONUS_AT = 10;
  const STREAK_BONUS_POINTS = 5;
  const bonusEl = document.getElementById('bonus');
  try { best = parseInt(localStorage.getItem('whackBest'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // Mole artwork, drawn once and reused. Fur, velvet shading and paws are all SVG.
  const MOLE_SVG = `
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet" width="100%" height="100%">
      <path class="body" d="M5 100 C1 54 22 10 50 10 C78 10 99 54 95 100 Z" fill="url(#furDark)" filter="url(#furTex)"/>
      <ellipse cx="40" cy="26" rx="22" ry="9" fill="#ffffff" opacity=".10"/>
      <g>
        <ellipse cx="14" cy="80" rx="11" ry="9" fill="url(#pawGrad)"/>
        <path d="M6 87 l-3 6 M10 89 l-2 7 M15 90 l0 7 M20 89 l2 7" stroke="#f3ece2" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <g>
        <ellipse cx="86" cy="80" rx="11" ry="9" fill="url(#pawGrad)"/>
        <path d="M94 87 l3 6 M90 89 l2 7 M85 90 l0 7 M80 89 l-2 7" stroke="#f3ece2" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <path d="M33 66 Q50 74 67 66 L63 76 Q50 82 37 76 Z" fill="url(#snoutGrad)" opacity=".0"/>
      <ellipse cx="50" cy="60" rx="17" ry="13" fill="url(#snoutGrad)"/>
      <ellipse cx="50" cy="51" rx="7.5" ry="5" fill="#8b4a4f"/>
      <ellipse cx="47.6" cy="49.6" rx="2.4" ry="1.2" fill="#ffffff" opacity=".55"/>
      <circle cx="33" cy="42" r="2.2" fill="#0c0806"/>
      <circle cx="67" cy="42" r="2.2" fill="#0c0806"/>
      <circle cx="33.7" cy="41.2" r=".7" fill="#ffffff" opacity=".7"/>
      <circle cx="67.7" cy="41.2" r=".7" fill="#ffffff" opacity=".7"/>
    </svg>`;

  // Build holes
  const holes = [];
  for (let i = 0; i < HOLES; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    const mole = document.createElement('div');
    mole.className = 'mole';
    const nose = document.createElement('div');
    nose.className = 'nose';
    mole.appendChild(nose);
    const hands = document.createElement('div');
    hands.className = 'hands';
    hands.innerHTML = '<i></i><i></i>';
    mole.appendChild(hands);
    hole.appendChild(mole);
    hole.addEventListener('pointerdown', () => onWhack(i));
    boardEl.appendChild(hole);
    holes.push({ hole, mole, hideTimer: null, isBlue: false });
  }

  // ---- Decoration: grass tufts and wandering ants ----
  const antsLayer = document.getElementById('ants');
  const tuftsLayer = document.getElementById('tufts');
  const GREENS = ['#2e6b2a', '#4f9a3c', '#7cc15a', '#3f8a33'];
  const rand = (a, b) => a + Math.random() * (b - a);

  const TUFT_SVG = c => `<svg viewBox="0 0 40 30" width="100%" height="100%"><g fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M20 30 Q14 12 6 6"/><path d="M20 30 Q18 10 20 2"/><path d="M20 30 Q22 12 33 8"/><path d="M20 30 Q12 18 2 16"/><path d="M20 30 Q27 18 37 20"/></g></svg>`;
  const ANT_SVG = `<svg viewBox="0 0 20 14" width="100%" height="100%"><g fill="#2a1a0e"><circle cx="16" cy="7" r="2.2"/><ellipse cx="10" cy="7" rx="2.6" ry="1.8"/><ellipse cx="4" cy="7" rx="3.4" ry="2.6"/></g><g stroke="#2a1a0e" stroke-width=".7"><path d="M9 7 L5 1 M9 7 L5 13 M10 7 L8 0 M10 7 L8 14 M11 7 L14 1 M11 7 L14 13"/></g></svg>`;

  // Grass tufts across the page at about 1 per 280 px², skipping any that would sit on text or controls.
  // Positions are in page pixels, so the layer covers the full scrollable height.
  // Seeded random numbers, so the tuft pattern stays the same instead of reshuffling on each rebuild
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const tuftRandom = mulberry32(20261123);
  const trand = (a, b) => a + tuftRandom() * (b - a);

  const TEXT_SELECTORS = 'h1, .hud, .bonus, .thermo-wrap, #startBtn, #msg, .lb';
  function buildTufts() {
    const W = window.innerWidth;
    const H = document.documentElement.scrollHeight;
    tuftsLayer.style.height = H + 'px';
    tuftsLayer.innerHTML = '';
    const blocked = [...document.querySelectorAll(TEXT_SELECTORS)].map(el => {
      const r = el.getBoundingClientRect(), pad = 6;

  // Three worms slither under the grass. Now and then one burrows out of sight and comes up a short way off
  const WORM_MAX = 8;                 // ants on a worm before it burrows

  // Leaves a dark hole in the grass, then fades it out after about 20 seconds
  function makeWormHole(x, y) {

  function placeWorm(w) {
    w.el.style.left = w.x + 'px';

  }
  // Wanders gently with a slithering sway; turns back toward the middle near the edges
  // Going underground: most ants on the worm drop off, but one or two ride down the hole with it
  function startWormBurrow(w, dx, dy) {
    w.mode = 'entering';

    const tunnel = Math.min(w.riders, Math.random() < 0.5 ? 1 : 2);

  // Coming up: the tunnel ants reappear at the new hole and rest for ten seconds

      w.y = w.cy0 + dy * w.d;

      w.clipR = w.d;                     // the ground hides the part that has gone in
      w.angle = w.heading * 180 / Math.PI;

        w.mode = 'under';
        w.underLeft = 5;                 // five seconds underground
      }

    if (w.mode === 'under') {

      if (w.underLeft <= 0) {

        w.ex = Math.min(W - 30, Math.max(30, w.x + Math.cos(ang) * r));
        w.ey = Math.min(H - 30, Math.max(30, w.y + Math.sin(ang) * r));
        w.heading = rand(0, Math.PI * 2);
        w.e = 0;

        w.mode = 'emerging';

      placeWorm(w);
      return;

    if (w.mode === 'emerging') {

      w.x = w.ex + ndx * (w.e - 35);

      w.clipR = 0;

  // Flying: a random turn every few tenths of a second, pulled back toward the target
  function flyBug(b, dx, dy, dist, dt) {

  // ---- Ants hopping onto ladybugs ----

    const ang = d < 1 ? rand(0, Math.PI * 2) : Math.atan2(a.y - from.y, a.x - from.x) + rand(-0.5, 0.5);
    const r = rand(70, 120);

  function pickEdge(b, W, H) {

    else if (side === 1) { b.tx = rand(0, W); b.ty = H + 80; }
    else if (side === 2) { b.tx = -80; b.ty = rand(0, H); }
    else { b.tx = W + 80; b.ty = rand(0, H); }
  }
  function departBug(b) {

    const W = window.innerWidth, H = window.innerHeight;
    const side = Math.floor(Math.random() * 4);

    else if (side === 1) { b.x = rand(0, W); b.y = H + 60; }
    else if (side === 2) { b.x = -60; b.y = rand(0, H); }
    else { b.x = W + 60; b.y = rand(0, H); }

  }

  // ---- The little boy: wanders, runs from ladybugs, then crouches in the grass until they leave ----
  const BOY_SVG = `<svg viewBox="0 0 40 80">
      <path class="hair" d="M11 16 Q4 34 7 56 Q8 64 4 72 Q12 68 14 60 L26 60 Q28 68 36 72 Q32 64 33 56 Q36 34 29 16 Z" fill="#6b3f1f"/>

  const boyEl = document.createElement('div');
  boyEl.className = 'boy';
  boyEl.innerHTML = BOY_SVG;
  antsLayer.appendChild(boyEl);      // under the grass tufts, so he runs through them
  const boy = {
    el: boyEl, x: window.innerWidth / 2, y: window.innerHeight / 2,
    tx: 0, ty: 0, dir: 1, state: 'wander', timer: 0, clear: 0
  };
  function pickBoyTarget() {
    boy.tx = rand(40, window.innerWidth - 40);
    boy.ty = rand(80, window.innerHeight - 40);
  }
  pickBoyTarget();
  function nearestLadybug() {
    let best = { d: Infinity, x: 0, y: 0 };
    bugs.forEach(b => {
      const d = Math.hypot(b.x - boy.x, b.y - boy.y);
      if (d < best.d) best = { d, x: b.x, y: b.y };
    });
    return best;
  }
  function placeBoy() {
    boy.el.style.left = boy.x + 'px';
    boy.el.style.top = boy.y + 'px';
    boy.el.style.transform = `translate(-50%,-100%) scaleX(${boy.dir})`;
  }
  function moveBoy(dt) {
    const W = window.innerWidth, H = window.innerHeight;
    const near = nearestLadybug();
    if (boy.state === 'hide') {
      // Crouched in the grass, under the tufts. Comes back up after 3 seconds with no ladybugs nearby
      boy.clear = near.d < 150 ? 0 : boy.clear + dt;
      if (boy.clear > 3) {
        boy.el.classList.remove('crouch');
        boy.state = 'wander';
        pickBoyTarget();
      }
      placeBoy();
      return;
    }
    if (boy.state === 'run') {
      // Run straight away from the nearest ladybug
      const ax = boy.x - near.x, ay = boy.y - near.y, L = Math.hypot(ax, ay) || 1;
      boy.x = Math.min(W - 20, Math.max(20, boy.x + ax / L * 170 * dt));
      boy.y = Math.min(H - 20, Math.max(40, boy.y + ay / L * 170 * dt));
      boy.dir = ax >= 0 ? 1 : -1;
      boy.timer -= dt;
      if (boy.timer <= 0) {
        if (near.d < 160) {
          // Still chased: dive into the grass and hide
          boy.state = 'hide';
          boy.clear = 0;
          boy.el.classList.remove('running');
          boy.el.classList.add('crouch');
          antsLayer.appendChild(boy.el);
        } else {
          boy.state = 'wander';
          boy.el.classList.remove('running');
          pickBoyTarget();
        }
      }
      placeBoy();
      return;
    }
    // Wander toward a target, but start running when a ladybug gets close
    if (near.d < 110) {
      boy.state = 'run';
      boy.timer = 1.2;
      boy.el.classList.add('running');
      placeBoy();
      return;
    }
    const dx = boy.tx - boy.x, dy = boy.ty - boy.y, d = Math.hypot(dx, dy);
    if (d < 6) {
      pickBoyTarget();
    } else {
      const step = Math.min(d, 30 * dt);
      boy.x += dx / d * step;
      boy.y += dy / d * step;
      boy.dir = dx >= 0 ? 1 : -1;
    }
    placeBoy();
  }
  let boyTs = performance.now();
  function boyLoop(ts) {
    const dt = Math.min(0.05, (ts - boyTs) / 1000);
    boyTs = ts;
    moveBoy(dt);
    requestAnimationFrame(boyLoop);
  }
  requestAnimationFrame(boyLoop);

  function setScore(n) { score = n; scoreEl.textContent = score; }

  // Difficulty: moles stay up and spawn faster as time passes
  function currentDifficulty() {
    // Ramp by fraction of the round, so the longer game eases in and ends at the same pace as before
    const progress = (GAME_TIME - timeLeft) / GAME_TIME;   // 0 at the start, 1 at the end
    return {
      upTime: Math.max(550, 1400 - progress * 850),
      spawnDelay: Math.max(280, 1000 - progress * 720),
      extra: progress > 0.5 ? 1 : 0   // occasionally pop two at once in the second half
    };
  }

  function popMole() {
    if (!running || quakeActive) return;
    const { upTime, extra } = currentDifficulty();
    const elapsed = GAME_TIME - timeLeft;
    const count = 1 + (extra && Math.random() < 0.3 ? 1 : 0);
    for (let c = 0; c < count; c++) {
      const idle = holes.map((h, i) => i).filter(i => !holes[i].mole.classList.contains('up'));
      if (!idle.length) break;
      const i = idle[Math.floor(Math.random() * idle.length)];
      const h = holes[i];
      const isBlue = elapsed >= BLUE_AFTER && Math.random() < BLUE_CHANCE;
      h.isBlue = isBlue;
      h.mole.classList.toggle('blue', isBlue);
      h.mole.classList.remove('whacked');
      h.mole.classList.add('up');
      h.hideTimer = setTimeout(() => hide(i), upTime);
    }
  }

  function hide(i) {
    const h = holes[i];
    clearTimeout(h.hideTimer);
    h.mole.classList.remove('up');
  }

  function onWhack(i) {
    if (!running) return;
    const h = holes[i];
    const isUp = h.mole.classList.contains('up');
    if (isUp && !h.mole.classList.contains('whacked') && h.isBlue) {
      // Hit a blue mole: game over
      h.mole.classList.add('whacked');
      endGame('blue');
      return;
    }
    if (isUp && !h.mole.classList.contains('whacked')) {
      h.mole.classList.add('whacked');
      setScore(score + 1);
      floatText(h.hole, '+1');
      playHitSound();
      hits++;
      updateAccuracy();
      streak++;
      if (streak >= STREAK_BONUS_AT) {
        setScore(score + STREAK_BONUS_POINTS);
        showBonus();
        streak = 0;
      }
      clearTimeout(h.hideTimer);
      setTimeout(() => hide(i), 120);
    } else {
      setScore(score - 1);
      streak = 0;
      playMissSound();
      misses++;
      if (updateAccuracy() <= ACCURACY_GAME_OVER) endGame('accuracy');
      h.hole.classList.remove('miss');
      void h.hole.offsetWidth;
      h.hole.classList.add('miss');
      floatText(h.hole, '-1', '#ff6b6b');
    }
  }

  // Low rumble for the earthquake: filtered noise plus a deep wobbling tone
  let quakeNodes = [];
  function playQuakeSound() {
    const ctx = getAudio();
    if (!ctx) return;
    const dur = QUAKE_LENGTH / 1000;
    const t0 = ctx.currentTime;

    const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const lowpass = ctx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.value = 140;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.9, t0 + 0.2);
    noiseGain.gain.setValueAtTime(0.9, t0 + dur - 0.6);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    noise.connect(lowpass).connect(noiseGain).connect(ctx.destination);

    const rumble = ctx.createOscillator();
    const rumbleGain = ctx.createGain();
    rumble.type = 'sawtooth';
    rumble.frequency.setValueAtTime(48, t0);
    rumble.frequency.linearRampToValueAtTime(34, t0 + dur);
    rumbleGain.gain.setValueAtTime(0.0001, t0);
    rumbleGain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.2);
    rumbleGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    rumble.connect(rumbleGain).connect(ctx.destination);

    noise.start(t0);
    noise.stop(t0 + dur);
    rumble.start(t0);
    rumble.stop(t0 + dur);
    quakeNodes = [noise, rumble];
  }

  // Earthquakes: random chance after a while, lasting 3 seconds
  function maybeQuake() {
    const elapsed = GAME_TIME - timeLeft;
    if (!quakeActive && elapsed >= QUAKE_AFTER && Math.random() < QUAKE_CHANCE) startQuake();
  }

  function startQuake() {
    quakeActive = true;
    document.body.classList.add('quake');
    holes.forEach(h => {
      if (h.mole.classList.contains('up')) {
        clearTimeout(h.hideTimer);          // freeze moles that are up
        h.mole.classList.add('frozen');     // hands over heads
      }
    });
    msgEl.textContent = 'EARTHQUAKE! Hold on!';
    playQuakeSound();
    clearTimeout(quakeTimer);
    quakeTimer = setTimeout(endQuake, QUAKE_LENGTH);
  }

  function endQuake() {
    quakeActive = false;
    document.body.classList.remove('quake');
    holes.forEach((h, i) => {
      h.mole.classList.remove('frozen');
      if (h.mole.classList.contains('up')) {
        clearTimeout(h.hideTimer);
        h.hideTimer = setTimeout(() => hide(i), 700);   // let them hide soon after
      }
    });
    if (running) msgEl.textContent = 'Phew! Back to whacking.';
  }

  function stopQuake() {
    clearTimeout(quakeTimer);
    quakeNodes.forEach(n => { try { n.stop(); } catch (e) {} });
    quakeNodes = [];
    quakeActive = false;
    document.body.classList.remove('quake');
    holes.forEach(h => h.mole.classList.remove('frozen'));
  }

  // Thermometer colour: blue at 80%+, smoothly blending to red by 50%
  function thermoColor(pct) {
    const blue = [58, 123, 213], red = [229, 57, 53];
    let t = (ACCURACY_FULL - pct) / (ACCURACY_FULL - ACCURACY_GAME_OVER);
    t = Math.max(0, Math.min(1, t));
    const c = blue.map((b, i) => Math.round(b + (red[i] - b) * t));
    return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
  }

  function updateAccuracy() {
    const total = hits + misses;
    const pct = total ? Math.round(hits / total * 100) : 100;
    const color = thermoColor(pct);
    accEl.textContent = pct + '%';
    accEl.style.color = color;
    fillEl.style.width = Math.max(0, Math.min(100, pct)) + '%';
    fillEl.style.background = color;
    hitsEl.textContent = hits;
    missesEl.textContent = misses;
    return pct;
  }

  // Shows the streak bonus above the board for 3 seconds
  function showBonus() {
    bonusEl.classList.add('show');
    clearTimeout(bonusTimer);
    bonusTimer = setTimeout(() => bonusEl.classList.remove('show'), 3000);
  }

  function floatText(parent, text, color) {
    const span = document.createElement('div');
    span.className = 'hit-text';
    span.textContent = text;
    if (color) span.style.color = color;
    parent.appendChild(span);
    setTimeout(() => span.remove(), 650);
  }

  function scheduleSpawn() {
    if (!running) return;
    const { spawnDelay } = currentDifficulty();
    spawnTimer = setTimeout(() => {
      popMole();
      maybeQuake();
      scheduleSpawn();
    }, spawnDelay * (0.7 + Math.random() * 0.6));
  }

  // Sad "wah-wah-wahhh" descending trombone, made with Web Audio (no files needed)
  function playSadSound() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioCtx = audioCtx || new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t0 = audioCtx.currentTime + 0.05;
      const notes = [
        [392, 0.00, 0.45],
        [370, 0.45, 0.45],
        [349, 0.90, 0.45],
        [330, 1.35, 1.30]
      ];
      notes.forEach(([freq, start, dur]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t0 + start);
        osc.frequency.linearRampToValueAtTime(freq * 0.9, t0 + start + dur);
        gain.gain.setValueAtTime(0.0001, t0 + start);
        gain.gain.exponentialRampToValueAtTime(0.25, t0 + start + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0 + start);
        osc.stop(t0 + start + dur + 0.05);
      });
    } catch (e) { /* audio unavailable; the game still works */ }
  }

  // Shared audio helper: returns a ready AudioContext, or null if unavailable
  function getAudio() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = audioCtx || new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }

  // Bright two-note "ding" on a successful whack
  function playHitSound() {
    const ctx = getAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime;
    [[880, 0.00], [1320, 0.07]].forEach(([freq, start]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t0 + start);
      gain.gain.setValueAtTime(0.0001, t0 + start);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + start + 0.15);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0 + start);
      osc.stop(t0 + start + 0.16);
    });
  }

  // Short low, buzzy "bonk" on a miss
  function playMissSound() {
    const ctx = getAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(180, t0);
    osc.frequency.exponentialRampToValueAtTime(70, t0 + 0.22);
    gain.gain.setValueAtTime(0.18, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.26);
  }

  function showBanner() {
    bannerEl.classList.remove('show');
    void bannerEl.offsetWidth;   // restart the animation
    bannerEl.classList.add('show');
  }

  // ---- 3-2-1 countdown ----
  const countdownEl = document.getElementById('countdown');
  const WING_SVG = `<svg viewBox="0 0 60 40"><ellipse cx="30" cy="20" rx="27" ry="16" fill="rgba(230,243,255,.8)" stroke="#ffffff" stroke-width="1.5"/><path d="M12 20 H48" stroke="rgba(120,160,200,.7)" stroke-width="1"/></svg>`;

  function playBeep(freq) {
    const ctx = getAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.22);
  }

  // Wings whoosh: swept band-pass noise with a fast flutter
  function playWingWhoosh() {
    const ctx = getAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime, dur = 0.9;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const band = ctx.createBiquadFilter();
    band.type = 'bandpass';
    band.Q.value = 1.5;
    band.frequency.setValueAtTime(400, t0);
    band.frequency.exponentialRampToValueAtTime(3000, t0 + dur);
    const flutter = ctx.createGain();
    flutter.gain.setValueAtTime(1, t0);
    for (let t = 0; t < dur; t += 0.045) {
      flutter.gain.setValueAtTime((Math.round(t / 0.045) % 2) ? 0.25 : 1, t0 + t);
    }
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.exponentialRampToValueAtTime(0.5, t0 + 0.15);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(band).connect(flutter).connect(env).connect(ctx.destination);
    src.start(t0);
    src.stop(t0 + dur);
  }

  // One number: pops in, holds, then flies off in a random direction with flapping wings
  function flyNumber(text, freq) {
    const el = document.createElement('div');
    el.className = 'count-num';
    el.innerHTML = `<span class="count-wing l">${WING_SVG}</span>${text}<span class="count-wing r">${WING_SVG}</span>`;
    countdownEl.appendChild(el);
    playBeep(freq);
    const far = Math.max(window.innerWidth, window.innerHeight) * 1.2;
    const a = rand(0, Math.PI * 2);
    const dx = Math.cos(a) * far, dy = Math.sin(a) * far, rot = rand(-150, 150);
    const anim = el.animate([
      { transform: 'translate(-50%,-50%) scale(.2)', opacity: 0 },
      { transform: 'translate(-50%,-50%) scale(1.15)', opacity: 1, offset: .22 },
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .35 },
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .55, easing: 'ease-in' },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rot}deg) scale(.7)`, opacity: 0 }
    ], { duration: 1200, fill: 'forwards' });
    setTimeout(playWingWhoosh, 660);
    anim.onfinish = () => el.remove();
  }

  function runCountdown(done) {
    countingDown = true;
    startBtn.style.display = 'none';
    msgEl.textContent = 'Get ready!';
    const steps = ['3', '2', '1'];
    steps.forEach((label, i) => setTimeout(() => flyNumber(label, 440 + i * 80), i * 1200));
    setTimeout(() => { countingDown = false; done(); }, steps.length * 1200 - 300);
  }

  function startGame() {
    if (running || countingDown) return;
    runCountdown(beginRound);
  }

  function beginRound() {
    if (running) return;
    running = true;
    setScore(0);
    streak = 0;
    hits = 0;
    misses = 0;
    updateAccuracy();
    clearTimeout(bonusTimer);
    bonusEl.classList.remove('show');
    stopQuake();
    timeLeft = GAME_TIME;
    timeEl.textContent = timeLeft;
    msgEl.textContent = 'Go! Watch for blue moles!';
    window.rebuildTufts();
    bannerEl.classList.remove('show');
    startBtn.style.display = 'none';
    tickTimer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame(null);
    }, 1000);
    popMole();
    scheduleSpawn();
  }

  // overBy: null (time ran out), 'blue' (hit a blue mole), or 'accuracy' (fell to 50%)
  function endGame(overBy) {
    running = false;
    clearInterval(tickTimer);
    clearTimeout(spawnTimer);
    stopQuake();
    holes.forEach((h, i) => hide(i));
    const newBest = score > best;
    if (newBest) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('whackBest', String(best)); } catch (e) {}
    }
    if (overBy) {
      timeEl.textContent = timeLeft;
      showBanner();
      playSadSound();
      const reason = overBy === 'blue'
        ? 'You whacked a blue mole!'
        : `Accuracy dropped to ${ACCURACY_GAME_OVER}%!`;
      msgEl.textContent = `${reason} Final score: ${score}` + (newBest ? ' (New best!)' : '');
    } else {
      timeEl.textContent = 0;
      msgEl.textContent = newBest
        ? `New best! Final score: ${score}`
        : `Time's up! Final score: ${score}`;
    }
    startBtn.textContent = 'Play Again';
    startBtn.style.display = 'inline-block';
    window.rebuildTufts();   // the message and buttons changed size, so move tufts clear of them
    // Lets the leaderboard script offer to save this score
    window.dispatchEvent(new CustomEvent('whack-gameover', { detail: { score } }));
  }

  startBtn.addEventListener('click', startGame);

  // Stop pinch-zoom and double-tap zoom, which could push the holes off screen
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(type =>
    document.addEventListener(type, e => e.preventDefault(), { passive: false }));
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd < 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // Stop the page from scrolling when a finger drags across the play area
  document.querySelector('.stage').addEventListener('touchmove', e => e.preventDefault(), { passive: false });
})();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, doc, getDoc, setDoc, query, where, limit, getDocs, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Paste your Firebase web app config here (Project settings > Your apps).
  // These values identify the project; they are not secret. Access is controlled by firestore.rules.
  const firebaseConfig = {
    apiKey: "AIzaSyCtudIW6g80kBRFUQAxa3KgUD7QIBVTrJc",
    authDomain: "whacky-310b5.firebaseapp.com",
    projectId: "whacky-310b5",
    appId: "1:240628370820:web:3ef1a64ba2ab551a3e61d1"
  };

  const formEl = document.getElementById('lb-form');
  const nameEl = document.getElementById('lb-name');
  const saveBtn = document.getElementById('lb-save');
  const listEl = document.getElementById('lb-list');
  const statusEl = document.getElementById('lb-status');
  let pendingScore = null;

  // Remember the player's name on this device so they don't have to retype it
  function savedName() {
    try { return localStorage.getItem('whackName') || ''; } catch (e) { return ''; }
  }
  // A random token kept on this device, so only the device that saved a name can update it
  function deviceToken() {
    try {
      let t = localStorage.getItem('whackDevice');
      if (!t || !/^[A-Za-z0-9-]{16,64}$/.test(t)) {
        const rnd = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
        t = rnd;
        localStorage.setItem('whackDevice', t);
      }
      return t;
    } catch (e) {
      return 'nostorage-' + Math.random().toString(16).slice(2, 18);
    }
  }
  nameEl.value = savedName();

  const configured = !firebaseConfig.projectId.startsWith('REPLACE');
  let db = null;
  if (configured) {
    try { db = getFirestore(initializeApp(firebaseConfig)); } catch (e) { db = null; }
  }
  if (!db) statusEl.textContent = 'Leaderboard is not set up yet.';

  // Scores are grouped by day in Toronto time (Eastern), so the board resets at midnight
  function todayKey() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    const get = t => parts.find(p => p.type === t).value;
    return `${get('year')}-${get('month')}-${get('day')}`;
  }

  async function loadBoard() {
    if (!db) return;
    try {
      const day = todayKey();
      // Single-field filter only, so no composite index is needed; sorting happens here
      const snap = await getDocs(query(collection(db, 'scores'), where('day', '==', day), limit(200)));
      const rows = snap.docs.map(d => d.data()).sort((a, b) => b.score - a.score).slice(0, 10);
      listEl.innerHTML = '';
      rows.forEach(v => {
        const li = document.createElement('li');
        const name = document.createElement('span');
        name.textContent = v.name;               // textContent avoids injecting HTML
        const pts = document.createElement('b');
        pts.textContent = v.score;
        li.append(name, pts);
        listEl.appendChild(li);
      });
      if (!rows.length) statusEl.textContent = 'No scores yet today. Be the first!';
      if (window.rebuildTufts) window.rebuildTufts();   // the leaderboard list changed size
    } catch (e) {
      statusEl.textContent = 'Could not load the leaderboard.';
    }
  }

  window.addEventListener('whack-gameover', e => {
    const score = e.detail.score;
    if (!db) return;
    if (score <= 0) { statusEl.textContent = 'Scores of 0 are not saved.'; return; }
    pendingScore = score;
    formEl.style.display = 'flex';
    nameEl.value = savedName();
    nameEl.focus();
    statusEl.textContent = `Enter your name to save ${score} points:`;
  });

  saveBtn.addEventListener('click', async () => {
    const name = nameEl.value.trim();
    if (!name) { statusEl.textContent = 'Please enter a name.'; return; }
    if (!/^[A-Za-z0-9 _-]{1,12}$/.test(name)) {
      statusEl.textContent = 'Use 1-12 letters, numbers, spaces, _ or -.';
      return;
    }
    try { localStorage.setItem('whackName', name); } catch (e) {}
    // One entry per name per day: the document ID is the day plus the lowercase name
    const day = todayKey();
    const ref = doc(db, 'scores', `${day}__${name.toLowerCase()}`);
    const owner = deviceToken();
    saveBtn.disabled = true;
    try {
      const existing = await getDoc(ref);
      if (existing.exists()) {
        const prev = existing.data();
        if (prev.owner !== owner) {
          statusEl.textContent = `"${name}" is already taken today. Try another name.`;
          return;
        }
        if (pendingScore <= prev.score) {
          statusEl.textContent = `Your best today is ${prev.score}, so this score does not replace it.`;
          return;
        }
        // Same device: replace its own entry with the higher score
        await setDoc(ref, { name: prev.name, score: pendingScore, day, owner, createdAt: serverTimestamp() });
        formEl.style.display = 'none';
        statusEl.textContent = `Updated! New best today: ${pendingScore}`;
        pendingScore = null;
        await loadBoard();
        return;
      }
      await setDoc(ref, { name, score: pendingScore, day, owner, createdAt: serverTimestamp() });
      formEl.style.display = 'none';
      statusEl.textContent = 'Saved!';
      pendingScore = null;
      await loadBoard();
    } catch (err) {
      console.error(err);
      statusEl.textContent = err.code === 'permission-denied'
        ? 'Saving was blocked by the database rules. Publish the latest firestore.rules.'
        : 'Could not save your score. Try again later.';
    } finally {
      saveBtn.disabled = false;
    }
  });

  loadBoard();
</script>
</body>
</html>
